name: Automatic Builds
on:
    push:
        branches:
            - main
            - master
        paths-ignore:
            - "**.md"
            - docs/**
    pull_request:
        branches:
            - main
            - master
        paths-ignore:
            - "**.md"
            - docs/**
jobs:
    build:
        name: "Build for ${{ matrix.artifactName }}"
        runs-on: ubuntu-latest
        strategy:
            matrix:
                unityVersion:
                    - 2021.3.45f2
                include:
                    - targetPlatform: StandaloneWindows
                      artifactName: Windows (x86)
                    - targetPlatform: StandaloneWindows64
                      artifactName: Windows (x86-64)
                    - targetPlatform: StandaloneOSX
                      artifactName: Mac OS X (Universal)
                    - targetPlatform: StandaloneLinux64
                      artifactName: Linux (x86-64)
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            - name: Cache Unity Library
              uses: actions/cache@v4
              with:
                  path: Library
                  key: >-
                      Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**',
                      'Packages/**', 'ProjectSettings/**') }}
                  restore-keys: |
                      Library-${{ matrix.targetPlatform }}-
            - name: Build Project
              uses: game-ci/unity-builder@v4
              env:
                  UNITY_LICENSE: "${{ secrets.UNITY_LICENSE }}"
                  UNITY_EMAIL: "${{ secrets.UNITY_EMAIL }}"
                  UNITY_PASSWORD: "${{ secrets.UNITY_PASSWORD }}"
              with:
                  targetPlatform: "${{ matrix.targetPlatform }}"
                  unityVersion: "${{ matrix.unityVersion }}"
                  buildName: "iOS 6 Simulator"
            - name: Upload Build Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: "${{ matrix.artifactName }}"
                  path: build
